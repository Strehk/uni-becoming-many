# Static host for the built experience (index.html) + the vendored synth
# (synth.html), which the app also loads as a same-origin iframe overlay.

types {
  # nginx's stock mime.types predates glTF; without these the browser gets
  # application/octet-stream and three.js' loaders complain.
  model/gltf-binary  glb;
  model/gltf+json    gltf;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
  text/plain text/css application/javascript application/json
  image/svg+xml font/ttf model/gltf+json;
# .glb and .mp3 are already compressed containers — gzipping them just burns CPU.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Terrain/creature .glb payloads are large; don't let a slow client stall a worker.
  sendfile on;
  tcp_nopush on;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite's hashed output — the filename changes whenever the content does.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed payloads copied from public/: revalidate, but let the CDN/browser
  # hold on to them between visits.
  location ~* \.(glb|gltf|mp3|ttf|png|jpg|webp)$ {
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    try_files $uri =404;
  }

  # Two real entry points, no client-side router — so no SPA fallback:
  # a typo'd path should 404 rather than silently boot the world.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
