# ── Becoming Many — GitHub Pages deployment ──
#
# Builds the Vite bundle and publishes it as the Pages site of this fork
# (https://e-mus.github.io/becoming-many-prototyp-alpha/). BASE_PATH tells Vite —
# and through it `asset()` in src/asset-url.ts — that the site lives in a project
# sub-path rather than at the domain root.
#
# The world needs WebGPU, so the deployed page runs in Chrome/Edge (and Safari 26+).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deployment needs elevated rights; the checkout stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a running deploy, but never interrupts one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
